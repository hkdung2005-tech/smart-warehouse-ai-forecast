# version: "3.9"  # obsolete, removed to avoid warning

services:
  # ─────────────────────────────────────────────
  # RabbitMQ (AMQP broker + Management UI)
  # ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: warehouse_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI → http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # PostgreSQL 15
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: warehouse_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # FastAPI — Smart Warehouse API
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: warehouse_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-warehouse}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      MAIN_QUEUE: ${MAIN_QUEUE:-jobs}
      DLQ: ${DLQ:-jobs.dlq}
      MAX_RETRIES: ${MAX_RETRIES:-3}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app  # hot-reload trong dev

  # ─────────────────────────────────────────────
  # Worker — consume RabbitMQ, gọi Gemini, retry/DLQ
  # ─────────────────────────────────────────────
  worker:
    build:
      context: .         # root vì Dockerfile dùng COPY worker/...
      dockerfile: worker/Dockerfile
    container_name: warehouse_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-warehouse}
      GEMINI_API_URL: ${GEMINI_API_URL:-http://localhost:9000/generate}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAIN_QUEUE: ${MAIN_QUEUE:-jobs}
      DLQ: ${DLQ:-jobs.dlq}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-10}
      PREFETCH_COUNT: ${PREFETCH_COUNT:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started  # api declare queues trước khi worker connect

# ─────────────────────────────────────────────
# Named volumes (dữ liệu không mất khi restart)
# ─────────────────────────────────────────────
volumes:
  rabbitmq_data:
  postgres_data:
